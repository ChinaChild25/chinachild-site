name: Publish scheduled blog posts

on:
  schedule:
    # Monday 09:00 Moscow = 06:00 UTC
    - cron: "0 6 * * 1"
    # Thursday 09:00 Moscow = 06:00 UTC
    - cron: "0 6 * * 4"

  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to publish"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish scheduled post
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then
            COUNT="1"
          fi

          PUBLISH_COUNT="$COUNT" node scripts/publish-scheduled-blog.mjs

      - name: Generate and store article audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_TTS_MODEL: gpt-4o-mini-tts
          OPENAI_TTS_VOICE: marin
        run: node scripts/generate-blog-audio.mjs

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog content/scheduled-blog
          git commit -m "chore(blog): publish scheduled article"
          git push
