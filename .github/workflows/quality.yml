name: Repository checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'AGENTS.md']
  pull_request:
    paths-ignore: ['**/*.md', 'AGENTS.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://chinachild.ru
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install XML validator used by SEO tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
      - run: npm ci
      - run: npm run lint
      - name: Check unused files, dependencies and unresolved imports
        run: npm run audit:unused
      - run: npm run test:leads
      - run: npm run test:monitoring
      - run: npm run test:blog
      - run: npm run test:seo
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build static site and audit JSON-LD
        # Public read-only content access; no service-role or OpenAI credentials.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - run: npm run typecheck
      - name: Check SEO including generated HTML and sitemaps
        run: node --test scripts/seo/tests/pass3-technical-integrity.test.mts

  secrets:
    name: Secrets in Git history
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with the pinned, checksum-verified Gitleaks CLI
        shell: bash
        run: |
          gitleaks_dir=$(mktemp -d)
          trap 'rm -rf "$gitleaks_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$gitleaks_dir/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_dir/gitleaks.tgz" | sha256sum --check --status
          tar -xzf "$gitleaks_dir/gitleaks.tgz" -C "$gitleaks_dir" gitleaks
          "$gitleaks_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
